<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Audio Copilot IPP • Biblioteca de Presets</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="markdown.css">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/logo-audio-copilot-v1.png">

</head>

<body>

    <!-- ===================================================== -->
    <!-- TOPO -->
    <!-- ===================================================== -->

    <header class="topbar">

        <div class="brand">

            <!-- Botão do menu (aparece apenas no celular) -->
            <button
                id="menu-toggle"
                class="menu-toggle"
                title="Abrir menu">

                ☰

            </button>

            <img
                src="assets/logo-audio-copilot-v1.png"
                alt="Audio Copilot IPP"
                class="logo">

            <div>

                <h1>Audio Copilot IPP</h1>
                <span>Biblioteca Oficial de Presets</span>

            </div>

        </div>

        <div class="top-actions">

            <input
                id="search"
                type="text"
                placeholder="Buscar preset...">

            <button
                id="theme-toggle"
                title="Alternar tema">

                🌙

            </button>

        </div>

    </header>

    <!-- ===================================================== -->
    <!-- LAYOUT -->
    <!-- ===================================================== -->

    <div class="layout">

        <!-- MENU -->

        <aside
            id="sidebar"
            class="sidebar">

            <!-- menu.js monta automaticamente -->

        </aside>

        <!-- CONTEÚDO -->

        <main class="content">

            <div
                id="viewer"
                class="viewer">

                <h1>Bem-vindo</h1>

                <p>
                    Selecione um preset no menu lateral.
                </p>

            </div>

        </main>

    </div>

    <!-- ===================================================== -->
    <!-- RODAPÉ -->
    <!-- ===================================================== -->

    <footer>

        Audio Copilot IPP © 2026

    </footer>

    <!-- ===================================================== -->
    <!-- BIBLIOTECAS -->
    <!-- ===================================================== -->

    <!-- Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- ===================================================== -->
    <!-- DADOS -->
    <!-- ===================================================== -->

    <script src="js/presets.js"></script>

    <!-- Arquivo gerado automaticamente pelo Python -->
    <script src="js/database.js"></script>

    <!-- ===================================================== -->
    <!-- SISTEMA -->
    <!-- ===================================================== -->

    <script src="js/menu.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/search.js"></script>
    <script src="js/theme.js"></script>

    <!-- Inicialização -->
    <script src="script.js"></script>

</body>

</html>
